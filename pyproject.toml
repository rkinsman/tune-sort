[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tune-sort"
version = "0.1.0"
description = "Sort an Apple Music playlist into playlists by bass tuning"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
tune-sort = "tune_sort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Optional[...] kept for consistency with the existing code.
# B008: typer.Option defaults are the library's idiom.
ignore = ["UP045", "B008"]

[tool.ruff.lint.per-file-ignores]
# Test-writer's style choices (typing.List, %-formatting); not changed by the implementer.
"tests/*" = ["UP006", "UP031", "UP035"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.package-data]
tune_sort = ["py.typed"]

[[tool.mypy.overrides]]
# Tests are unannotated pytest functions; still type-check what they call.
module = ["conftest", "test_cache", "test_cli", "test_matching", "test_resolver", "test_songsterr", "test_sorter", "test_tuning", "test_ultimate_guitar"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
