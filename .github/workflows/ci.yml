name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Tests use a fake Music backend and recorded fixtures, so they don't need macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy src tests
      - run: uv run pytest
